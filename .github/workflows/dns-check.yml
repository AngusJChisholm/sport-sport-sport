name: DNS check (one-off)

on:
  push:
    branches: [main]
    paths: [".github/workflows/dns-check.yml"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check sportsportsport.com.au and remove this workflow
        run: |
          {
            echo "== A sportsportsport.com.au"; dig +short A sportsportsport.com.au @8.8.8.8
            echo "== CNAME www"; dig +short CNAME www.sportsportsport.com.au @8.8.8.8
            echo "== NS"; dig +short NS sportsportsport.com.au @8.8.8.8
            echo "== HTTP"; curl -sI http://sportsportsport.com.au | head -5
            echo "== BODY"; curl -s http://sportsportsport.com.au | grep -io "<title>[^<]*" | head -1
          } > dns-check.txt 2>&1
          cat dns-check.txt
          git rm -q .github/workflows/dns-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add dns-check.txt
          git commit -m "DNS check result [skip netlify]"
          git push
