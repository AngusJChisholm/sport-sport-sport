name: Site check (one-off)

on:
  push:
    branches: [main]
    paths: [".github/workflows/site-check.yml"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the new domain and remove this workflow
        run: |
          {
            echo "== http new domain"; curl -s -o /dev/null -w "%{http_code} %{redirect_url}\n" http://sportsportsport.com.au/
            echo "== https new domain"; curl -s -o /dev/null -w "%{http_code}\n" https://sportsportsport.com.au/ || echo "https not ready"
            echo "== title"; curl -sL http://sportsportsport.com.au/ | grep -io "<title>[^<]*" | head -1
            echo "== old github.io"; curl -s -o /dev/null -w "%{http_code} %{redirect_url}\n" https://angusjchisholm.github.io/sport-sport-sport/
            echo "== article"; curl -sL -o /dev/null -w "%{http_code}\n" http://sportsportsport.com.au/articles/2026-10-14-adobe-australian-open.html
            echo "== deals.json"; curl -sL -o /dev/null -w "%{http_code}\n" http://sportsportsport.com.au/deals.json
            echo "== ig reel via old url"; curl -sIL https://angusjchisholm.github.io/sport-sport-sport/ig/2026-10-14/reel.mp4 | grep -iE "^HTTP|^location|content-type"
          } > site-check.txt 2>&1
          cat site-check.txt
          git rm -q .github/workflows/site-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add site-check.txt
          git commit -m "Site check result [skip netlify]"
          git push
