name: Enrich deals and build brand/property pages

# Runs whenever deals.json or entities.json changes (e.g. the 6am update). Adds deal type, term and end
# year to new deals (tools/enrich.py), files each property's own partner tiers (tools/ptiers.py), then rebuilds the page for every brand and property plus the
# sitemap (tools/build_profiles.py), then rebuilds SSS Pro's partner matches and their backtest (tools/match.py).
# Its own commit triggers one more run, which finds nothing to do.
on:
  push:
    branches: [main]
    paths: ["deals.json", "entities.json", "tools/markets.py", "profile.html", "tools/enrich.py", "tools/build_profiles.py", "tools/ptiers.py", "tools/match.py", "tools/subcat_rules.py", "tools/locations.py", "tools/audit.py", "coverage.json"]
  workflow_dispatch:

concurrency:
  group: profiles
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enrich new deals
        run: python3 tools/enrich.py

      - name: Tag each deal's market (Australia, New Zealand, North America, UK & Ireland, Europe, Asia, Middle East, Rest of World, Global)
        run: python3 tools/markets.py

      - name: Property tiers (each property's own partner groupings)
        run: cd tools && python3 ptiers.py

      - name: Build brand and property pages
        run: python3 tools/build_profiles.py

      - name: SSS Pro matches, backtest and data audit
        run: |
          python3 tools/match.py
          python3 tools/audit.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deals.json entities.json brands properties sitemap.xml pro/matches.json pro/audit.json
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Brand and property pages [skip netlify]"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
