name: Logo check
on:
  workflow_dispatch:
    inputs:
      mode: {description: "candidates or all", required: false, default: "candidates"}
permissions: {contents: write}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/logo_check.py ${{ inputs.mode }}
      # The report goes to its own branch so it never touches the live site.
      - run: |
          mv logo-report.json /tmp/ && git checkout --orphan logo-report && git rm -rqf . && mv /tmp/logo-report.json .
          git add logo-report.json && git -c user.name="SSS bot" -c user.email="bot@sportsportsport.com.au" commit -qm "Logo report"
          git push -qf origin logo-report
