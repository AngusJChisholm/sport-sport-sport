name: Copy photos to the site

on:
  push:
    branches: [main]
    paths: ["deals.json", "features.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download new photos
        run: python3 tools/fetch_photos.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/u
          git diff --cached --quiet && exit 0
          git commit -m "Copy photos to the site"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
