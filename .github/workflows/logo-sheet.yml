name: Logo sheet screenshots
on: workflow_dispatch
permissions: {contents: write}
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: python tools/logo_sheet_shots.py
      - run: |
          cd shots && git init -q && git checkout -q -b logo-shots && git add . && git -c user.name="SSS bot" -c user.email="bot@sportsportsport.com.au" commit -qm shots
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logo-shots
