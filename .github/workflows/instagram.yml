name: Instagram autopilot

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths: ["instagram/queue/**", "instagram/CHECK"]
  workflow_dispatch:
    inputs:
      action:
        description: "plan = normal run, render = force re-render today's images, dedupe-check = list repeat posts, dedupe-delete = delete repeat posts (keeps the first of each)"
        default: plan
        type: choice
        options: [plan, render, dedupe-check, dedupe-delete]

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clean up repeat posts
        if: startsWith(inputs.action, 'dedupe')
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_LOGIN: ${{ vars.IG_LOGIN }}
        run: python3 tools/instagram_post.py dedupe ${{ inputs.action == 'dedupe-delete' && 'delete' || 'check' }}

      - name: What's due
        id: plan
        if: ${{ !startsWith(inputs.action, 'dedupe') }}
        run: python3 tools/instagram_post.py plan

      - name: Install renderer
        if: steps.plan.outputs.render == 'true' || inputs.action == 'render'
        run: |
          pip install playwright==1.48.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -version | head -1

      - name: Render today's images
        if: steps.plan.outputs.render == 'true' || inputs.action == 'render'
        run: python3 tools/instagram_post.py render

      - name: Post to Instagram
        if: steps.plan.outputs.post == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          IG_LOGIN: ${{ vars.IG_LOGIN }}
        run: |
          if [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "Instagram secrets not set yet - skipping posting"; exit 0
          fi
          python3 tools/instagram_post.py post

      - name: Daily stats
        if: steps.plan.outputs.stats == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_LOGIN: ${{ vars.IG_LOGIN }}
        run: |
          if [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCESS_TOKEN" ]; then exit 0; fi
          python3 tools/instagram_post.py stats || echo "Stats failed - posting unaffected"

      - name: Connection check
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ig-check]')
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_LOGIN: ${{ vars.IG_LOGIN }}
        run: python3 tools/instagram_post.py check
